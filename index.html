<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Offer | Get Started Today</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header, section, footer { padding: 0 1.5rem; }
    .container { max-width: 960px; margin: 0 auto; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.25rem 0;
    }
    .logo { font-weight: 700; font-size: 1.2rem; }
    nav a {
      color: var(--text); text-decoration: none; margin-left: 1.5rem; font-weight: 500;
    }

    .hero { text-align: center; padding: 5rem 0 4rem; }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 1rem;
    }
    .hero p {
      color: var(--muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 2rem;
    }
    .btn {
      display: inline-block; background: var(--accent); color: #fff;
      padding: 0.85rem 1.75rem; border-radius: 999px; text-decoration: none;
      font-weight: 600; transition: background 0.2s, transform 0.2s;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

    .features {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem; padding: 3rem 0;
    }
    .feature {
      background: var(--card); padding: 1.75rem; border-radius: var(--radius);
      border: 1px solid #e5e7eb;
    }
    .feature h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }
    .feature p { color: var(--muted); font-size: 0.95rem; }

    .pricing { padding: 3rem 0; text-align: center; }
    .pricing h2 { font-size: 2rem; margin-bottom: 2rem; }
    .price-card {
      background: var(--card); max-width: 380px; margin: 0 auto;
      padding: 2.5rem 2rem; border-radius: var(--radius);
      border: 2px solid var(--accent);
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.1);
    }
    .price { font-size: 3rem; font-weight: 700; margin: 0.5rem 0; }
    .price span { font-size: 1rem; color: var(--muted); font-weight: 400; }
    .price-card ul {
      list-style: none; margin: 1.5rem 0 2rem; text-align: left;
    }
    .price-card li { padding: 0.4rem 0; }
    .price-card li::before { content: "✓ "; color: var(--accent); font-weight: 700; }

    form {
      display: grid; gap: 0.75rem; max-width: 480px; margin: 0 auto;
    }
    input, textarea {
      font: inherit; padding: 0.8rem 1rem; border: 1px solid #d1d5db;
      border-radius: 10px; width: 100%;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .contact { padding: 3rem 0; text-align: center; }
    .contact h2 { margin-bottom: 0.5rem; }
    .contact > .container > p { color: var(--muted); margin-bottom: 2rem; }

    footer {
      text-align: center; color: var(--muted); font-size: 0.9rem;
      padding: 2.5rem 0; border-top: 1px solid #e5e7eb; margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header class="container">
    <nav>
      <div class="logo">SimpleOffer</div>
      <div>
        <a href="#features">Benefits</a>
        <a href="#pricing">Pricing</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <section class="hero container">
    <h1>A simple solution that saves you time</h1>
    <p>Describe the one problem you solve, in one clear sentence.
